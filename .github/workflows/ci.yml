name: Offline tests
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        # ubuntu-latest moved to 26.04, which no longer has a Python 3.9 build.
        # Keep the oldest supported version on the last image that ships it.
        include:
          - python: '3.9'
            runner: ubuntu-24.04
          - python: '3.12'
            runner: ubuntu-latest
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install .
      - run: python test.py
      - run: python -m unittest discover -s macos/tests -v
